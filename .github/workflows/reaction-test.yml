name: Reaction Test (send mapped message)

# Sends ONE labeled test message and records its idMessage in msgmap.json, so a
# later emoji reaction can be resolved and starred by the Poll workflow.
# Optional target_number sends a 1:1 message to that number instead of the group
# (to test whether an incoming reaction from a different person is delivered).
on:
  workflow_dispatch:
    inputs:
      target_number:
        description: "Optional: send to this number (digits, e.g. 972542600047) instead of the group"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r fb-brief/requirements.txt

      - name: Send mapped test message
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
          TARGET_NUMBER: ${{ inputs.target_number }}
        run: python fb-brief/send_reaction_test.py

      - name: Commit message map
        run: |
          if [ -z "$(git status --porcelain fb-brief/monthly)" ]; then
            echo "No msgmap changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fb-brief/monthly
          git commit -m "chore: map reaction-test message [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push retry $i"; sleep 3
          done
