name: Green API Setup

# Run manually to enable incoming reaction notifications on the instance.
#   mode=set   -> setSettings then poll getSettings until it applies (default)
#   mode=check -> only read the true persisted settings (no reboot)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "set / check / diag / sendtest (send one test message)"
        type: choice
        options: [set, check, diag, hosttest, history, groups, sendtest]
        default: set
      to:
        description: "sendtest: recipient phone (e.g. 972542600047) or chatId"
        type: string
        default: ""
      text:
        description: "sendtest: optional message text"
        type: string
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Configure Green API
        env:
          GREEN_API_INSTANCE: ${{ secrets.GREEN_API_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_CHAT_ID: ${{ secrets.GREEN_API_CHAT_ID }}
          MODE: ${{ inputs.mode }}
          TEST_TO: ${{ inputs.to }}
          TEST_TEXT: ${{ inputs.text }}
        run: python fb-brief/green_setup.py
