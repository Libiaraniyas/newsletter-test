<!doctype html>
<html lang="en" dir="ltr">
<body dir="ltr" style="margin:0;padding:0;background:#051D4D;font-family:Arial,Helvetica,sans-serif;">
``
<tr>
  <td style="padding:10px 20px 18px 20px;" dir="ltr">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <!-- TEXT (LEFT) -->
        <td width="50%" valign="top" style="padding-right:10px; text-align:left;">
          <div style="font-size:16px;line-height:22px;font-weight:700;color:#000;">
            {{TITLE}}
          </div>
          <div style="font-size:13px;line-height:18px;color:#000;margin-top:8px;">
            {{SUMMARY}}
          </div>

          <!-- BUTTON -->
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:14px;">
            <tr>
              <td bgcolor="#000204" style="border:1px solid #93A3B9;border-radius:3px;">
                <a target="_blank" href="{{URL}}"
                   style="display:inline-block;padding:10px 18px;color:#FFFFFF;text-decoration:none;font-size:13px;font-weight:700;">
                  View
                </a>
              </td>
            </tr>
          </table>
        </td>

        <!-- IMAGE (RIGHT) -->
        <td width="50%" align="right" valign="top" style="padding-left:10px;">
          <img src="{{IMAGE_URL}}" width="260" alt=""
               style="display:block;border:0;outline:none;text-decoration:none;width:260px;max-width:260px;height:auto;">
        </td>
      </tr>
    </table>
  </td>
</tr>
